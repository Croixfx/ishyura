name: Deploy to Cloudflare Workers with D1 Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Migrate D1 & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Verify Cloudflare Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing Secret::CLOUDFLARE_API_TOKEN is not set in GitHub repository secrets!"
            echo "To fix this:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions."
            echo "2. Click 'New repository secret'."
            echo "3. Name: CLOUDFLARE_API_TOKEN"
            echo "4. Secret: Your Cloudflare API Token (with D1:Edit, Workers Scripts:Edit, Account:Read permissions)."
            echo "5. (Optional) Also add CLOUDFLARE_ACCOUNT_ID with your Cloudflare Account ID."
            exit 1
          fi

      - name: Build project
        run: npm run build

      - name: Apply D1 Migrations Automatically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ishyura-db --remote

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
