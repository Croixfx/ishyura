name: Deploy to Cloudflare Workers with D1 Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Migrate D1 & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is configured. Proceeding with D1 migrations & deploy."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Token Notice::CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. If you use GitHub Actions to deploy, add CLOUDFLARE_API_TOKEN in Settings > Secrets > Actions. Cloudflare's native Git integration will build directly."
          fi

      - name: Apply D1 Migrations Automatically
        if: steps.check_creds.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ishyura-db --remote

      - name: Deploy Worker to Cloudflare
        if: steps.check_creds.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
