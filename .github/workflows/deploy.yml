name: Deploy to Cloudflare Workers with D1 Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Migrate D1 & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Verify Cloudflare Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare Token::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets! Please add CLOUDFLARE_API_TOKEN under GitHub Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare token is present."
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          else
            echo "::warning title=Missing Account ID::CLOUDFLARE_ACCOUNT_ID is not explicitly set in GitHub Secrets. Wrangler will attempt to detect the account from the API token."
          fi

      - name: Check Cloudflare Authentication (wrangler whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking Cloudflare account credentials..."
          npx wrangler whoami || echo "Notice: wrangler whoami finished."

      - name: Configure D1 Database ID (if provided in secrets)
        env:
          CUSTOM_DB_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          if [ -n "$CUSTOM_DB_ID" ]; then
            echo "Applying custom database_id from GitHub secrets: $CUSTOM_DB_ID"
            sed -i "s/database_id = \".*\"/database_id = \"$CUSTOM_DB_ID\"/" wrangler.toml
          else
            echo "Using database_id configured in wrangler.toml"
          fi

      - name: Apply D1 Migrations (Non-blocking fallback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Attempting to apply D1 migrations to remote database 'ishyura-db'..."
          if (echo "y" | npx wrangler d1 migrations apply ishyura-db --remote); then
            echo "✅ D1 migrations applied successfully via CLI!"
          else
            echo "::warning title=D1 CLI Migration Skipped::Wrangler CLI migration encountered an authorization or database ID issue (code 7403). Proceeding with Worker deployment because the Ishyura application code automatically self-initializes all required D1 tables and schemas via ensureD1Tables() at runtime."
          fi

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
