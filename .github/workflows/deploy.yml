name: Deploy to Cloudflare Workers with D1 Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Migrate D1 & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Verify Cloudflare Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare Token::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets! Please add CLOUDFLARE_API_TOKEN under GitHub Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare token is present."
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          else
            echo "::warning title=Missing Account ID::CLOUDFLARE_ACCOUNT_ID is not explicitly set in GitHub Secrets. Wrangler will attempt to detect the account from the API token."
          fi

      - name: Check Cloudflare Authentication (wrangler whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking Cloudflare account credentials..."
          npx wrangler whoami || echo "Notice: wrangler whoami finished."

      - name: Configure D1 Database ID (if provided in secrets)
        env:
          CUSTOM_DB_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          if [ -n "$CUSTOM_DB_ID" ]; then
            echo "Applying custom database_id from GitHub secrets: $CUSTOM_DB_ID"
            sed -i "s/database_id = \".*\"/database_id = \"$CUSTOM_DB_ID\"/" wrangler.toml
          else
            echo "Using database_id configured in wrangler.toml"
          fi

      - name: Apply D1 Migrations Automatically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying D1 migrations to remote database 'ishyura-db'..."
          if ! (echo "y" | npx wrangler d1 migrations apply ishyura-db --remote); then
            echo "::error title=Cloudflare D1 Migration Failed (Code 7403 or Permission Error)::Cloudflare rejected authorization for D1. Please check: 1) Ensure your Cloudflare API Token has 'Account > D1 > Edit' permission (the default Workers template does NOT include D1!). 2) Verify that the D1 database ID in wrangler.toml or CLOUDFLARE_DATABASE_ID secret matches a database created in YOUR Cloudflare account (create one via 'npx wrangler d1 create ishyura-db' or Cloudflare Dashboard). 3) Verify your CLOUDFLARE_ACCOUNT_ID secret matches your Cloudflare account."
            exit 1
          fi

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
